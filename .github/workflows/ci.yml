name: CI

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  android:
    name: Android and shared checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v4
      - name: Install the configured Android SDK platform
        run: |
          sdkmanager --list --channel=3 | grep -E 'platforms;android-37\.0|build-tools;37.0.0' || true
          sdkmanager --install "platforms;android-37.0" "build-tools;37.0.0" --channel=3
      - uses: gradle/actions/setup-gradle@v6
      - name: Run shared tests and build Android app
        run: ./gradlew :shared:testAndroidHostTest :androidApp:assembleDebug
      - name: Compile Room migration instrumentation tests
        run: ./gradlew :shared:compileAndroidDeviceTest
      - uses: ReactiveCircus/android-emulator-runner@v2
        with:
          api-level: 35
          arch: x86_64
          profile: pixel_6
          script: ./gradlew :shared:connectedAndroidDeviceTest
      - name: Test AI backend
        run: ./gradlew -p aiBackend test

  ios-device-build:
    name: iOS device build (unsigned)
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '17'
      - uses: gradle/actions/setup-gradle@v6
      - name: Compile shared iOS arm64 framework
        run: ./gradlew :shared:compileKotlinIosArm64
      - name: Build iOS app for generic device
        run: >-
          xcodebuild -project iosApp/iosApp.xcodeproj -scheme iosApp
          -sdk iphoneos -destination 'generic/platform=iOS'
          CODE_SIGNING_ALLOWED=NO build
